<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="lensBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="70%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="glassGlow" cx="42%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Outer Housing Ring -->
  <circle cx="64" cy="64" r="60" fill="url(#lensBg)" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Optical Accent Ring -->
  <circle cx="64" cy="64" r="47" fill="none" stroke="url(#ringAccent)" stroke-width="2"/>

  <!-- Inner Barrel -->
  <circle cx="64" cy="64" r="42" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

  <!-- Aperture Iris Blades -->
  <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" fill="url(#bladeGrad)">
    <path d="M 64 24 L 84 38 L 74 54 Z"/>
    <path d="M 84 38 L 94 62 L 78 68 Z"/>
    <path d="M 94 62 L 80 84 L 64 74 Z"/>
    <path d="M 80 84 L 54 88 L 54 68 Z"/>
    <path d="M 54 88 L 34 70 L 48 56 Z"/>
    <path d="M 34 70 L 44 40 L 64 50 Z"/>
  </g>

  <!-- Central Optical Core -->
  <circle cx="64" cy="64" r="22" fill="#030712" stroke="#0ea5e9" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="22" fill="url(#glassGlow)"/>

  <!-- Precision Sensor Reflection / Pupil -->
  <circle cx="64" cy="64" r="6" fill="#38bdf8" opacity="0.85"/>
  <circle cx="61" cy="61" r="2" fill="#ffffff" opacity="0.95"/>
</svg>
